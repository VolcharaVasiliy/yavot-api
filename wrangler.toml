name = "yavot-api"
main = "worker.mjs"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Optional, non-secret defaults. These are pre-filled (empty) so the Cloudflare deploy
# page does NOT force you to enter them. Secrets (YANDEX_SESSION_ID, YTDLP_ONLINE_COOKIE)
# should be added via `wrangler secret put <NAME>` instead.
[vars]
YAVOT_PROXY = "off"
YANDEX_SESSION_ID = ""
YANDEX_API_TOKEN = ""
YTDLP_ONLINE = ""
YTDLP_ONLINE_COOKIE = ""
