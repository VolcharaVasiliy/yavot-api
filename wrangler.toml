name = "yavot-api"
main = "worker.mjs"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# These are pre-filled (optional) so the Cloudflare deploy page won't force you to
# enter them. Secrets (YANDEX_SESSION_ID, YTDLP_ONLINE_COOKIE) can also be set via
# `wrangler secret put <NAME>` instead. Empty / "null" means "not set".
[vars]
YAVOT_PROXY = "off"
YANDEX_SESSION_ID = ""
YANDEX_API_TOKEN = "null"
YTDLP_ONLINE = "1"
YTDLP_ONLINE_COOKIE = "null"
